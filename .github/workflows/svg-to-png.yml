name: Convert SVG to PNG (Commit Back)

on:
  push:
    branches:
      - main
    paths:
      - '**.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install librsvg
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Convert SVGs to PNGs
        run: |
          find . -name "*.svg" -type f | while read file; do
            filename=$(basename -- "$file")
            dirname=$(dirname "$file")
            filename="${filename%.*}"
            output_file="$dirname/$filename.png"
            
            echo "Converting $file to $output_file ..."
            rsvg-convert -h 1000 "$file" -o "$output_file"
          done

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 先强制添加当前目录下所有文件（这样如果没PNG也不会报错，只会添加其他变动）
          git add .
          
          # 2. 检查暂存区里有没有东西
          if git diff --staged --quiet; then
            echo "没有发现新生成的 PNG 或文件变动，跳过提交。"
          else
            echo "发现变动，正在提交..."
            git commit -m "Auto-generated PNGs [skip ci]"
            git push
          fi
